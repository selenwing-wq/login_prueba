<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

</head>
<body style="background-color: #ccc;">
     <div class="container">
         <div class="row">
             <div class="col-md-4 offset-md-4">
                <div class="card">
                    <div class="card-body">
                         <form action="">
                              <div class="mt-2">
                                <label for="">Correo electronico</label>
                                <input id="email" type="email" class="form-control">
                              </div>
                               <div class="mt-2">
                                <label for="">Contraseña</label>
                                <input id="password" type="password" class="form-control">
                              </div>
                              <hr>
                              <button type="button" id="boton" class="btn btn-success">Autenticarmen</button>
                         </form>
                    </div>
                </div>
             </div>
         </div>
     </div>
</body>
<script>
    const userEmail = "pedrito@gmail.com";
    const userPassword = "password";
    
    const button = document.getElementById('boton');
    const email = document.getElementById('email');
    const password = document.getElementById('password');

    button.addEventListener('click', function(){
        if(userEmail == email.value && userPassword == password.value){
        console.log("muy bien datos correctos");

        // remover clase roja

        password.classList.remove('is-invalid');
        email.classList.remove('is-invalid');

        // agregar clase verde
    
        password.classList.add('is-valid');
        email.classList.add('is-valid');

        // redirigir

        window.location = "./home.html"

        // sesion storage
        sessionStorage.setItem("auth","true")
        sessionStorage.setItem("nombre", "Pedrito")

        }else{
        password.classList.add("is invalid");
        email.classList.add("is invalid");
        }  
    })
</script>
</html>
